services:
  pxe-server:
    build: .
    container_name: ubuntu-pxe-server
    restart: unless-stopped
    # IMPORTANT: On Linux, network_mode: host is required for DHCP broadcast (Layer 2)
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - SERVER_IP=192.168.1.100       # Host machine IP running Docker
      - HTTP_PORT=8080
      - DHCP_MODE=full                # 'full' (standalone DHCP) or 'proxy' (ProxyDHCP)
      - DHCP_RANGE_START=192.168.1.200
      - DHCP_RANGE_END=192.168.1.250
      - SUBNET_MASK=255.255.255.0
      - GATEWAY=192.168.1.1
      - DNS_SERVERS=8.8.8.8,1.1.1.1
    volumes:
      - ./data:/data
      - ./tftpboot:/tftpboot
